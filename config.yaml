targets:
  twitch:
    streamers: []  # Add Twitch usernames to monitor
    games: []      # Add game names (e.g. Deadlock, Valorant)
    clips_per_source: 100
    period: 24h
  kick:
    streamers: []
    clips_per_source: 100
  youtube:
    channels: []

settings:
  min_views: 100
  max_duration: 300
  shorts_threshold: 60
  language: en  # filters by broadcaster language (reliable, unlike clip language field)
  compilation_min_score: 45  # balances quality vs. having enough clips for a full compilation

autopilot:
  daily_count: 7
  min_score: 65
  game: ""
  scope: configured
  pre_llm_screen: true
  fallback_to_gamewide: false
  revive_skipped_candidates: true
  shorts_layout: fill
  period: 24h
  channel: default
  auto_upload: true
  privacy: public
  prefer_calibrated_streamers: true
  require_calibrated_streamers: true
  allow_uncalibrated_fallback: true
  profile_bonus_points: 8.0
  max_clips_per_streamer: 2
  priority_streamers: []
  priority_streamer_bonus: 25.0
  priority_streamer_max_clips: 4
  upload_channels: []

upload:
  title_template: "{title} | {streamer} {game}"
  description_template: |
    {streamer} with an insane {game} moment

    Watch {streamer} live: {url}

    Subscribe for daily highlights ↑

    {tags_as_hashtags}

    #shorts #{game_tag} #{streamer_tag} #clips #twitch #gaming
  default_privacy: unlisted
  max_uploads_per_day: 50

  global_tags:
    - gaming
    - gaming highlights
    - funny moments
    - best clips
    - twitch clips
    - stream highlights

  extract_thumbnail: true

subtitles:
  whisper_model: large-v3
  font_size: 52
  outline_width: 5
  words_per_phrase: 3

shorts:
  width: 1080
  height: 1920
  layout: fill
  game_layout_defaults: {}
  subtitle_margin_v: 450
  fill:
    gameplay:
      zoom: 1.0
      zoom_no_facecam: 1.08
    hud:
      border_px: 4
      border_color: "white@0.95"
    auto_detect_tuning_defaults: {}
    game_hud_defaults: {}

compilation:
  target_minutes: 10
  min_minutes: 5

crosspost:
  min_yt_views: 10000
  min_age_hours: 12

instagram:
  video_base_url: ""

channels:
  default:
    name: "Main Channel"
    platform: youtube
    token_file: ".clipper_token.json"
    default_privacy: public
    schedule:
      shorts_per_day: 7
      release_times: ["08:00", "10:00", "12:00", "14:00", "16:00", "18:00", "20:00", "22:00"]
  # Add more channels as needed:
  # my_tiktok:
  #   name: "TikTok"
  #   platform: tiktok
  #   token_file: ".clipper_tiktok.json"
  #   default_privacy: public
  #   schedule:
  #     shorts_per_day: 3
  #     release_times: ["08:00", "13:00", "19:00"]
